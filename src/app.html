<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yotpo Trusted Vendor Playground</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Plunc Framework -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/gh/kenjiefx/plunc/dist/plunc.min.js"
    ></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ["class", ".dark-mode"],
        theme: {
          extend: {
            fontFamily: {
              sans: [
                "Inter",
                "-apple-system",
                "BlinkMacSystemFont",
                "Segoe UI",
                "Roboto",
                "sans-serif",
              ],
              mono: [
                "JetBrains Mono",
                "ui-monospace",
                "SFMono-Regular",
                "Menlo",
                "Monaco",
                "Consolas",
                "monospace",
              ],
            },
            colors: {
              brand: {
                50: "#eef2ff",
                100: "#e0e7ff",
                200: "#c7d2fe",
                500: "#6366f1",
                600: "#4f46e5",
                700: "#4338ca",
                800: "#3730a3",
                900: "#312e81",
              },
            },
          },
        },
      };
    </script>

    <!-- Immediate theme setup to prevent flicker -->
    <script>
      if (localStorage.getItem("isDarkMode") === "true") {
        document.documentElement.classList.add("dark-mode");
        document.body?.classList.add("dark-mode");
      }
    </script>

    <!-- Custom CSS for Theme Transitions, Dark Mode, and Polish -->
    <style>
      :root {
        --bg-page: #f8fafc;
        --bg-card: #ffffff;
        --border-card: #e2e8f0;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --well-bg: #f1f5f9;
        --well-border: #e2e8f0;
        --input-bg: #ffffff;
        --input-border: #cbd5e1;
      }

      body.dark-mode {
        --bg-page: #0b0f19;
        --bg-card: #111827;
        --border-card: #1f293d;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --well-bg: #0d1525;
        --well-border: #1c273c;
        --input-bg: #090e17;
        --input-border: #22324f;
        background-color: #0b0f19 !important;
        color: #f8fafc !important;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--bg-page);
        color: var(--text-primary);
        transition:
          background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
          color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        min-height: 100vh;
      }

      /* Card styling */
      .tv-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 1rem;
        box-shadow:
          0 1px 3px 0 rgba(0, 0, 0, 0.05),
          0 1px 2px -1px rgba(0, 0, 0, 0.05);
        transition: all 0.25s ease;
      }

      body.dark-mode .tv-card {
        background-color: #111827 !important;
        border-color: #1e293b !important;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.35),
          0 2px 4px -2px rgba(0, 0, 0, 0.3) !important;
      }

      /* Wells & containers */
      .tv-well {
        background-color: var(--well-bg);
        border: 1px solid var(--well-border);
        border-radius: 0.75rem;
      }

      body.dark-mode .tv-well {
        background-color: #090e17 !important;
        border-color: #1b263b !important;
      }

      /* Input styling */
      .tv-input {
        background-color: var(--input-bg);
        border: 1px solid var(--input-border);
        color: var(--text-primary);
        border-radius: 0.625rem;
        transition: all 0.15s ease-in-out;
      }

      .tv-input:focus {
        outline: none;
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      }

      body.dark-mode .tv-input {
        background-color: #090e17 !important;
        border-color: #22324f !important;
        color: #f8fafc !important;
      }

      body.dark-mode .tv-input::placeholder {
        color: #475569;
      }

      body.dark-mode .tv-input:focus {
        border-color: #818cf8 !important;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.28) !important;
      }

      /* Method Tab Buttons - Works directly with plunc-style returning bg-blue-700 / bg-blue-500 */
      .method-tab-btn {
        cursor: pointer;
        user-select: none;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
      }

      .method-tab-btn.bg-blue-700 {
        background: linear-gradient(
          135deg,
          #2563eb 0%,
          #1d4ed8 100%
        ) !important;
        color: #ffffff !important;
        box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.45) !important;
        border-color: rgba(255, 255, 255, 0.2) !important;
        font-weight: 600 !important;
      }

      .method-tab-btn.bg-blue-500 {
        background: transparent !important;
        color: #64748b !important;
        box-shadow: none !important;
      }

      .method-tab-btn.bg-blue-500:hover {
        background: rgba(148, 163, 184, 0.12) !important;
        color: #0f172a !important;
      }

      body.dark-mode .method-tab-btn.bg-blue-700 {
        background: linear-gradient(
          135deg,
          #4f46e5 0%,
          #3b82f6 100%
        ) !important;
        box-shadow: 0 4px 14px -2px rgba(79, 70, 229, 0.5) !important;
      }

      body.dark-mode .method-tab-btn.bg-blue-500 {
        color: #94a3b8 !important;
      }

      body.dark-mode .method-tab-btn.bg-blue-500:hover {
        background: rgba(255, 255, 255, 0.06) !important;
        color: #f8fafc !important;
      }

      /* Tables */
      .tv-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      .tv-table th {
        background-color: #f8fafc;
        color: #475569;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #e2e8f0;
      }

      body.dark-mode .tv-table th {
        background-color: #090e17 !important;
        color: #cbd5e1 !important;
        border-bottom-color: #1e293b !important;
      }

      .tv-table td {
        padding: 0.875rem 1rem;
        border-bottom: 1px solid #f1f5f9;
        font-size: 0.875rem;
        color: #334155;
      }

      body.dark-mode .tv-table td {
        border-bottom-color: #162032 !important;
        color: #cbd5e1 !important;
      }

      .tv-table tbody tr:hover td {
        background-color: rgba(241, 245, 249, 0.6);
      }

      body.dark-mode .tv-table tbody tr:hover td {
        background-color: rgba(255, 255, 255, 0.02) !important;
      }

      .tv-table tbody tr:last-child td {
        border-bottom: none;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      body.dark-mode ::-webkit-scrollbar-thumb {
        background: #334155;
      }
    </style>

    <script type="module" src="./app.js"></script>
  </head>
  <body class="selection:bg-indigo-500 selection:text-white">
    <!-- Plunc Application Mount Point -->
    <main plunc-app="App"></main>

    <!-- App Root Template -->
    <template plunc-name="App">
      <section plunc-component="Main"></section>
    </template>

    <!-- Main Component Template -->
    <template plunc-name="Main">
      <div class="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto space-y-8">
          <!-- Top Navigation & Header Bar -->
          <header
            class="tv-card p-6 flex flex-col md:flex-row md:items-center md:justify-between gap-6"
          >
            <div class="flex items-center gap-4">
              <div
                class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 shrink-0"
              >
                <!-- Verified Shield Icon -->
                <svg
                  class="w-6 h-6"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
                  />
                </svg>
              </div>
              <div>
                <div class="flex items-center gap-2.5 flex-wrap">
                  <h1
                    class="text-2xl font-bold tracking-tight text-slate-900 dark-mode:text-white"
                  >
                    Trusted Vendor Playground
                  </h1>
                </div>
                <p
                  class="text-sm text-slate-500 dark-mode:text-slate-400 mt-0.5"
                >
                  Interactive cryptographic signature engine & payload inspector
                  for verified reviews
                </p>
              </div>
            </div>

            <!-- Action Controls: Demo Data & Dark Mode Toggler -->
            <div
              class="flex items-center gap-4 self-start md:self-center shrink-0"
            >
              <!-- Preset Demo Button -->
              <button
                type="button"
                onclick="fillDemoData()"
                title="Fill sample credentials to immediately test"
                class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 dark-mode:bg-slate-800 dark-mode:text-slate-300 dark-mode:hover:bg-slate-700 transition-colors border border-slate-200 dark-mode:border-slate-700"
              >
                <svg
                  class="w-3.5 h-3.5 text-indigo-500"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 10V3L4 14h7v7l9-11h-7z"
                  />
                </svg>
                <span>Fill Demo Data</span>
              </button>

              <!-- Dark Mode Switch - Wrapped in plunc-block="DarkModeToggler" -->
              <div plunc-block="DarkModeToggler" class="flex items-center">
                <label
                  class="relative inline-flex items-center cursor-pointer select-none"
                >
                  <input
                    type="checkbox"
                    plunc-model="isDarkMode"
                    plunc-change="toggleDarkMode()"
                    class="sr-only peer"
                  />
                  <div
                    class="w-12 h-6 bg-slate-200 dark-mode:bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-6 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all after:shadow-sm peer-checked:bg-indigo-600 transition-colors"
                  ></div>
                  <span
                    class="ml-2.5 text-xs font-semibold text-slate-600 dark-mode:text-slate-300 flex items-center gap-1"
                  >
                    <svg
                      class="w-3.5 h-3.5 text-amber-500"
                      fill="currentColor"
                      viewBox="0 0 20 20"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                        clip-rule="evenodd"
                      />
                    </svg>
                    <span>Dark</span>
                  </span>
                </label>
              </div>
            </div>
          </header>

          <!-- Documentation & Overview Callout -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div
              class="md:col-span-2 tv-card p-6 border-l-4 border-l-indigo-600 flex items-start gap-4"
            >
              <div
                class="p-2.5 rounded-lg bg-indigo-50 dark-mode:bg-indigo-950/60 text-indigo-600 dark-mode:text-indigo-400 shrink-0"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  />
                </svg>
              </div>
              <div>
                <h2
                  class="text-sm font-bold uppercase tracking-wider text-slate-900 dark-mode:text-white"
                >
                  About Trusted Vendor
                </h2>
                <p
                  class="text-sm text-slate-600 dark-mode:text-slate-300 mt-1 leading-relaxed"
                >
                  Trusted Vendor enables merchants to programmatically create
                  verified buyers or verified reviewers without sending the
                  reviewer an automatic review request or confirmation email.
                  Reviews are cryptographically verified using a generated
                  signature attached to each submission.
                </p>
              </div>
            </div>

            <div
              class="tv-card p-6 border-l-4 border-l-amber-500 flex items-start gap-4"
            >
              <div
                class="p-2.5 rounded-lg bg-amber-50 dark-mode:bg-amber-950/60 text-amber-600 dark-mode:text-amber-400 shrink-0"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                  />
                </svg>
              </div>
              <div>
                <h2
                  class="text-sm font-bold uppercase tracking-wider text-slate-900 dark-mode:text-white"
                >
                  Digest Algorithm Note
                </h2>
                <p
                  class="text-xs text-slate-600 dark-mode:text-slate-300 mt-1 leading-relaxed"
                >
                  Ensure the Digest Algorithm selected matches your Yotpo
                  account settings (<strong>HMAC</strong> or
                  <strong>SHA256</strong>). Submissions will fail verification
                  if the algorithm does not match.
                </p>
              </div>
            </div>
          </div>

          <!-- Main Interactive Playground: 2-Column Responsive Layout -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <!-- Left Column: Form & Configuration (5 cols) -->
            <div class="lg:col-span-5 space-y-6">
              <div class="tv-card p-6 space-y-6">
                <div
                  class="flex items-center justify-between pb-4 border-b border-slate-200 dark-mode:border-slate-800"
                >
                  <div class="flex items-center gap-2.5">
                    <svg
                      class="w-5 h-5 text-indigo-500"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                      />
                    </svg>
                    <h3 class="font-bold text-slate-900 dark-mode:text-white">
                      Parameters & Credentials
                    </h3>
                  </div>
                  <span class="text-xs text-slate-400 font-mono"
                    >Live Inputs</span
                  >
                </div>

                <!-- Input Group: Account Credentials -->
                <div class="space-y-4">
                  <div>
                    <label
                      class="block text-xs font-semibold text-slate-700 dark-mode:text-slate-300 mb-1.5 uppercase tracking-wider"
                    >
                      Yotpo App Key <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                      <div
                        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"
                      >
                        <svg
                          class="w-4 h-4"
                          fill="none"
                          viewBox="0 0 24 24"
                          stroke="currentColor"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
                          />
                        </svg>
                      </div>
                      <input
                        type="text"
                        plunc-model="appKey"
                        plunc-change="onUpdate()"
                        placeholder="e.g. k5J4L3M2N1..."
                        class="tv-input w-full pl-9 pr-3 py-2.5 text-sm font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <div class="flex items-center justify-between mb-1.5">
                      <label
                        class="block text-xs font-semibold text-slate-700 dark-mode:text-slate-300 uppercase tracking-wider"
                      >
                        Account Secret Key <span class="text-rose-500">*</span>
                      </label>
                      <button
                        type="button"
                        onclick="toggleSecretVisibility()"
                        class="text-xs text-indigo-600 hover:text-indigo-500 dark-mode:text-indigo-400 font-medium"
                      >
                        <span id="secret-visibility-text">Show Secret</span>
                      </button>
                    </div>
                    <div class="relative">
                      <div
                        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"
                      >
                        <svg
                          class="w-4 h-4"
                          fill="none"
                          viewBox="0 0 24 24"
                          stroke="currentColor"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                          />
                        </svg>
                      </div>
                      <input
                        type="password"
                        id="secretKeyInput"
                        plunc-model="secretKey"
                        plunc-change="onUpdate()"
                        placeholder="e.g. secret_987654321..."
                        class="tv-input w-full pl-9 pr-3 py-2.5 text-sm font-mono"
                      />
                    </div>
                  </div>
                </div>

                <!-- Input Group: Reviewer & Product Details -->
                <div
                  class="space-y-4 pt-2 border-t border-slate-100 dark-mode:border-slate-800"
                >
                  <div>
                    <label
                      class="block text-xs font-semibold text-slate-700 dark-mode:text-slate-300 mb-1.5 uppercase tracking-wider"
                    >
                      Reviewer Email <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                      <div
                        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"
                      >
                        <svg
                          class="w-4 h-4"
                          fill="none"
                          viewBox="0 0 24 24"
                          stroke="currentColor"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"
                          />
                        </svg>
                      </div>
                      <input
                        type="email"
                        plunc-model="reviewerEmail"
                        plunc-change="onUpdate()"
                        placeholder="e.g. customer@example.com"
                        class="tv-input w-full pl-9 pr-3 py-2.5 text-sm"
                      />
                    </div>
                  </div>

                  <div>
                    <label
                      class="block text-xs font-semibold text-slate-700 dark-mode:text-slate-300 mb-1.5 uppercase tracking-wider"
                    >
                      Product ID (SKU) <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative">
                      <div
                        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"
                      >
                        <svg
                          class="w-4 h-4"
                          fill="none"
                          viewBox="0 0 24 24"
                          stroke="currentColor"
                        >
                          <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
                          />
                        </svg>
                      </div>
                      <input
                        type="text"
                        plunc-model="productId"
                        plunc-change="onUpdate()"
                        placeholder="e.g. 1001 or SKU-USB"
                        class="tv-input w-full pl-9 pr-3 py-2.5 text-sm font-mono"
                      />
                    </div>
                  </div>
                </div>

                <!-- Input Group: Crypto Options -->
                <div
                  class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-slate-100 dark-mode:border-slate-800"
                >
                  <div>
                    <label
                      class="block text-xs font-semibold text-slate-700 dark-mode:text-slate-300 mb-1.5 uppercase tracking-wider"
                    >
                      Digest Algorithm
                    </label>
                    <select
                      plunc-model="digestAlgorithm"
                      plunc-change="onUpdate()"
                      class="tv-input w-full p-2.5 text-sm font-medium"
                    >
                      <option value="HMAC">HMAC</option>

                <!-- Indicator: Reviewer Type -->
                <div
                  class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-slate-100 dark-mode:bg-slate-800/70 border border-slate-200 dark-mode:border-slate-700/80"
                >
                  <span
                    class="w-3 h-3 rounded-full bg-amber-400 shrink-0 shadow-sm shadow-amber-400/50"

                  <span
                    class="font-semibold text-slate-800 dark-mode:text-slate-200"

                  >
                  <span
                    class="text-[10px] text-slate-500 dark-mode:text-slate-400 font-mono ml-auto"
                    >reviewer_type</span
                  >
                </div>

                <!-- Indicator: Product ID -->

                  class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-slate-100 dark-mode:bg-slate-800/70 border border-slate-200 dark-mode:border-slate-700/80"

                </div>

                <!-- Indicator: Timestamp -->
                <div
                  class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg bg-slate-100 dark-mode:bg-slate-800/70 border border-slate-200 dark-mode:border-slate-700/80"
                >
                  <span
                    class="w-3 h-3 rounded-full bg-purple-400 shrink-0 shadow-sm shadow-purple-400/50"

                  <span
                    class="font-semibold text-slate-800 dark-mode:text-slate-200"

                  <span
                    class="text-[10px] text-slate-500 dark-mode:text-slate-400 font-mono ml-auto"

                data string is hashed via HMAC. Product ID is only included when
                reviewer type is <code>verified_buyer</code>.
              </div>
            </div>

            <div
              plunc-if="digestAlgorithm == 'SHA256'"
              class="p-3.5 rounded-lg bg-purple-50 dark-mode:bg-purple-950/40 border border-purple-200 dark-mode:border-purple-900/60 flex items-start gap-3"

                />

              <div
                class="text-xs text-purple-900 dark-mode:text-purple-200 leading-relaxed"

                concatenated message string before computing the SHA-256 digest.
              </div>
            </div>
          </div>
        </div>

    <!-- UI Helper Scripts -->
    <script>
      // Secret Key Visibility Toggle
      function toggleSecretVisibility() {
        const input = document.getElementById("secretKeyInput");
        const text = document.getElementById("secret-visibility-text");
        if (!input) return;
        if (input.type === "password") {
          input.type = "text";
          if (text) text.textContent = "Hide Secret";
        } else {
          input.type = "password";
          if (text) text.textContent = "Show Secret";
        }
      }

      // Copy signature value
      function copySignatureValue(btn) {
        const el = document.getElementById("signatureText");
        if (el && el.textContent.trim()) {
          navigator.clipboard.writeText(el.textContent.trim()).then(() => {
            showToast("Signature copied to clipboard!");
          });
        }
      }

      // Copy element text content
      function copyElementText(id, btn) {
        const el = document.getElementById(id);
        if (el) {
          const text = el.innerText || el.textContent;
          navigator.clipboard.writeText(text.trim()).then(() => {
            showToast("Copied to clipboard!");
            if (btn) {
              const orig = btn.innerHTML;
              btn.innerHTML = `<span class="text-emerald-400">Copied!</span>`;
              setTimeout(() => {
                btn.innerHTML = orig;
              }, 1800);
            }
          });
        }
      }

      // Toast notification helper
      function showToast(msg) {
        const toast = document.getElementById("toastNotification");
        const text = document.getElementById("toastMessage");
        if (!toast || !text) return;
        text.textContent = msg;
        toast.classList.remove("translate-y-12", "opacity-0");
        toast.classList.add("translate-y-0", "opacity-100");
        setTimeout(() => {
          toast.classList.remove("translate-y-0", "opacity-100");
          toast.classList.add("translate-y-12", "opacity-0");
        }, 2400);
      }

      // Demo Data Filler for Immediate Testing
      function fillDemoData() {
        const demoValues = {
          appKey: "yotpo_app_demo_772184",
          secretKey: "sec_key_xyz9814523a1",
          reviewerEmail: "elena.rostova@example.com",
          productId: "PROD-SKU-8820",
        };

        for (const [key, value] of Object.entries(demoValues)) {
          const input = document.querySelector(`[plunc-model="${key}"]`);
          if (input) {
            input.value = value;
            input.dispatchEvent(new Event("input", { bubbles: true }));
            input.dispatchEvent(new Event("change", { bubbles: true }));
          }
        }
        showToast("Demo data populated and signature generated!");
      }
    </script>
